name: cacaaotesouro_app
description: "Caça ao Tesouro - Jogo de equipes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Chamadas HTTP à API do servidor
  http: ^1.2.2

  # GPS / Localização
  geolocator: ^14.0.0

  # Persistência local (device_id, flags)
  shared_preferences: ^2.3.0

  # Câmera / Selfie
  image_picker: ^1.1.0

  # Leitura de QR Code
  mobile_scanner: 7.4.0

  # Gerenciamento de permissões (câmera, GPS)
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_bg.png
    - assets/images/olhando.gif
    - assets/images/surpresa.gif
    - assets/images/chorando.gif
