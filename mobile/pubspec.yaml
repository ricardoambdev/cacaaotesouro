name: cacaaotesouro_app
description: "Caça ao Tesouro - Jogo de equipes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Chamadas HTTP à API do servidor
  http: ^1.2.2

  # GPS / Localização
  geolocator: ^14.0.0

  # Persistência local (device_id, flags)
  shared_preferences: ^2.3.0

  # Câmera / Selfie
  image_picker: ^1.1.0

  # Leitura de QR Code
  mobile_scanner: 7.4.0

  # Gerenciamento de permissões (câmera, GPS)
  permission_handler: ^11.3.0

  # Sons (acerto/erro)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Gera os ícones do app a partir de assets/images/icon.png
# Rode: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_bg.png
    - assets/images/olhando.gif
    - assets/images/surpresa.gif
    - assets/images/chorando.gif
    - assets/images/poster.png
    - assets/sounds/acerto.mp3
    - assets/sounds/choro.mp3
    - assets/sounds/notificacao.mp3
